$kind: http-request
description: |-
  Requiere haber ejecutado antes "02 - Login correcto".

  Respuesta HTTP esperada: 200
url: http://127.0.0.1:3000/api/fichas
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código HTTP esperado: 200", () => pm.response.to.have.status(200));
      pm.test("Devuelve fichas", () => pm.expect(pm.response.json().fichas).to.be.an("array"));
    language: text/javascript
order: 7000
