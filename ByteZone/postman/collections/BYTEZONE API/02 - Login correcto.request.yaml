$kind: http-request
description: |-
  Guarda el token en la variable {{token}} para las siguientes peticiones.

  Respuesta HTTP esperada: 200
url: http://127.0.0.1:3000/api/auth/login
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "admin@bytezone.com",
      "password": "Admin123*"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código HTTP esperado: 200", () => pm.response.to.have.status(200));
      const j = pm.response.json();
      pm.test("Devuelve un token JWT", () => pm.expect(j.token).to.be.a("string"));
      pm.collectionVariables.set("token", j.token);
    language: text/javascript
order: 2000
