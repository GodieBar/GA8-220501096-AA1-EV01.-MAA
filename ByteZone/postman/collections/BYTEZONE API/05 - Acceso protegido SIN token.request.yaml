$kind: http-request
description: |-
  Ruta protegida exigida por la evidencia. No lleva header Authorization.

  Respuesta HTTP esperada: 401
url: http://127.0.0.1:3000/api/fichas
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código HTTP esperado: 401", () => pm.response.to.have.status(401));
      pm.test("Acceso denegado", () => pm.expect(pm.response.json().error).to.include("token"));
    language: text/javascript
order: 5000
