$kind: http-request
description: |-
  

  Respuesta HTTP esperada: 200
url: http://127.0.0.1:3000/api/productos
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código HTTP esperado: 200", () => pm.response.to.have.status(200));
      pm.test("Incluye lista de productos", () => pm.expect(pm.response.json().productos).to.be.an("array"));
    language: text/javascript
order: 4000
